name = "allahnawaz"
main = "worker.mjs"
compatibility_date = "2026-10-19"

[vars]
ALLOWED_ORIGIN = "https://allahnawaz36.github.io"

# D1 binding is intentionally omitted until a real database_id is available.
# After creating the D1 database in Cloudflare, add its actual ID here:
# [[d1_databases]]
# binding = "DB"
# database_name = "naz-business-assistant"
# database_id = "PASTE_REAL_D1_DATABASE_ID_HERE"

[ai]
binding = "AI"

# Public AI chat: max 10 requests per client key per 60 seconds.
# The Worker fails closed if this binding is unavailable.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
