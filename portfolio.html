<meta name="description" content="Allah Nawaz — UI/UX & Product Designer specialising in SaaS platforms, web applications and mobile experiences. Based in Islamabad, Pakistan. Open to remote projects.">
<meta name="author" content="Allah Nawaz">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://allahnawaz36.github.io/AllahNawaz-/">
<meta property="og:title" content="Allah Nawaz — UI/UX & Product Designer">
<meta property="og:description" content="UI/UX and product design portfolio focused on SaaS, web apps and mobile experiences.">

<meta property="og:image" content="https://allahnawaz36.github.io/AllahNawaz-/social-preview.png">
<title>Allah Nawaz — UI/UX & Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#10110f;--text:#f4f4ee;--muted:#a0a398;--lime:#d5ff72;--panel:#181a17;--line:#30332c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "DM Sans",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.card{max-width:560px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:40px 36px;text-align:center}
.monogram{display:inline-grid;place-items:center;width:56px;height:56px;background:var(--lime);color:#111;border-radius:16px;font:800 20px Manrope,sans-serif;margin-bottom:24px}
h1{font:700 28px/1.2 Manrope,sans-serif;letter-spacing:-.03em;margin:0 0 12px}
p{color:var(--muted);margin:0 0 28px;font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:999px;font-weight:700;font-size:13px;text-decoration:none;transition:transform .2s}
a.btn.primary{background:var(--lime);color:#151610}
a.btn.secondary{border:1px solid var(--line);color:var(--text)}
a.btn:hover{transform:translateY(-2px)}
.note{margin-top:28px;font-size:12px;color:#6b6f64}
</style>
</head>
<body>
  <div class="card">
    <div class="monogram">AN</div>
    <h1>Allah Nawaz</h1>
    <p>UI/UX & Product Designer · SaaS, web apps & mobile experiences<br>Islamabad, Pakistan · Open to remote projects</p>
    <div class="actions">
      <a class="btn primary" href="https://www.behance.net/allahnawaz175" target="_blank" rel="noopener noreferrer">View Behance portfolio ↗</a>
      <a class="btn secondary" href="https://www.linkedin.com/in/allah-nawaz-productdesigner/" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
      <a class="btn secondary" href="mailto:allahnawazmalik175@gmail.com">Email</a>
    </div>
    <p class="note">Full interactive portfolio is being updated with professional refinements and will return shortly.</p>
  </div>
</body>
</html>
