name: Deploy portfolio and Naz Assistant to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'portfolio.html'
      - 'naz-assistant.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'social-preview.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare standalone site pages
        run: |
          mkdir -p _site
          cp portfolio.html _site/index.html
          cp naz-assistant.html _site/naz-assistant.html
          mkdir -p _site/naz-assistant
          cp naz-assistant.html _site/naz-assistant/index.html
          cp robots.txt _site/robots.txt
          cp sitemap.xml _site/sitemap.xml
          cp social-preview.svg _site/social-preview.svg
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1200 -h 630 -o _site/social-preview.png social-preview.svg
          touch _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
