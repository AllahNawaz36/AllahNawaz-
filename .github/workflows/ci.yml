name: Project checks
on:
  push:
    branches: [main, fix/full-setup]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - run: npm test
      - name: Check inline JavaScript and duplicate HTML IDs
        run: |
          python - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          from urllib.parse import unquote

          class PageChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.scripts = []
                  self.ids = []
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"):
                      self.ids.append(attrs["id"])
                  if tag.lower() == "a":
                      self.links.append(attrs)
                  if tag.lower() == "script":
                      if "src" not in attrs and attrs.get("type", "").lower() not in ("application/ld+json", "application/json"):
                          self.current = []

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.scripts.append("".join(self.current))
                      self.current = None

          total_scripts = 0
          with tempfile.TemporaryDirectory() as temp:
              for page in ("index.html", "portfolio.html", "research.html"):
                  parser = PageChecker()
                  parser.feed(Path(page).read_text(encoding="utf-8"))
                  duplicates = sorted(key for key, count in Counter(parser.ids).items() if count > 1)
                  if duplicates:
                      raise SystemExit(f"{page} has duplicate IDs: {duplicates}")
                  if not parser.scripts:
                      raise SystemExit(f"No inline JavaScript found in {page}")
                  known_ids = set(parser.ids)
                  broken_fragments = sorted({
                      unquote(link.get("href", "")[1:])
                      for link in parser.links
                      if link.get("href", "").startswith("#")
                      and len(link.get("href", "")) > 1
                      and unquote(link.get("href", "")[1:]) not in known_ids
                  })
                  if broken_fragments:
                      raise SystemExit(f"{page} has broken in-page links: {broken_fragments}")
                  unsafe_blank_links = sorted({
                      link.get("href", "")
                      for link in parser.links
                      if link.get("target", "").lower() == "_blank"
                      and "noopener" not in link.get("rel", "").lower().split()
                  })
                  if unsafe_blank_links:
                      raise SystemExit(f"{page} has target=_blank links without rel=noopener: {unsafe_blank_links}")
                  script_source = "\\n".join(parser.scripts)
                  element_refs = sorted(set(re.findall(r"""getElementById\(\s*["']([^"']+)["']\s*\)""", script_source)))
                  missing_elements = sorted(set(element_refs) - known_ids)
                  if missing_elements:
                      raise SystemExit(f"{page} JavaScript references missing element IDs: {missing_elements}")
                  for index, script in enumerate(parser.scripts):
                      path = Path(temp) / (page.replace(".html", "") + "-" + str(index) + ".js")
                      path.write_text(script, encoding="utf-8")
                      subprocess.run(["node", "--check", str(path)], check=True)
                  total_scripts += len(parser.scripts)
                  print(f"{page}: {len(parser.scripts)} inline script(s); IDs unique; DOM references valid; in-page links valid; new-tab links safe.")
          print(f"Validated {total_scripts} inline script(s) across all three HTML pages.")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q allinone_bot.py workflows tests
      - run: python -m unittest discover -s tests -v
      - run: python allinone_bot.py --brief "CI smoke test" 
