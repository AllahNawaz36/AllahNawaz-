name: Project checks
on:
  push:
    branches: [main, fix/full-setup]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q allinone_bot.py workflows tests
      - run: python -m unittest discover -s tests -v
      - run: python allinone_bot.py --brief "CI smoke test" 
